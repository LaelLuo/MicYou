syntax = "proto3";

package micyou;

message MessageWrapper {
    AudioPacketMessageOrdered audioPacket = 1; // Used in TCP-only mode
    ConnectMessage connect = 2;               // Connection setup
    MuteMessage mute = 3;                     // Mute toggle
    reserved 4;
    PingMessage ping = 5;                     // Ping for latency
    PongMessage pong = 6;                     // Pong for latency
    // Cross-device plugin messaging (see docs/plugins/api-reference.md).
    // Unknown to legacy clients: proto3 skips it, so the wire stays compatible.
    PluginMessage pluginMessage = 7;
    // Desktop to phone once a second while connected, so the phone can show link quality.
    // Unknown to legacy clients: proto3 skips it, so the wire stays compatible.
    StatsMessage stats = 8;
    // Official field numbers 1-8 match upstream/master. Official may later
    // append fields in 9-999. Duplex-only fields start at 1000 so those
    // additions will not collide. This wire is not interoperable with
    // Duplex 2.1.2, which used fields 8/9/10 for downlink; upgrade the
    // desktop and phone together.
    DownlinkRequestMessage downlinkRequest = 1000;
    DownlinkStateMessage downlinkState = 1001;
    DownlinkAudioMessage downlinkAudio = 1002;
}

// Receive-side link statistics measured by the desktop.
message StatsMessage {
    int32 rttMs = 1;        // smoothed ping/pong round trip, 0 until the first pong
    float jitterMs = 2;     // audio packet arrival jitter
    float packetLoss = 3;   // fraction of audio packets lost, 0.0 to 1.0
    int32 latencyMs = 4;    // estimated end-to-end latency: receive buffer plus round trip
}

// Cross-device plugin message: request/response and one-way events between
// plugins on the phone and the desktop. `correlationId` pairs a request with
// its response (0 = one-way); `target` is the receiving plugin id ("" =
// broadcast); `errorCode` mirrors the plugin error codes (0 = ok).
message PluginMessage {
    string source = 1;       // plugin id of the sender
    string target = 2;       // plugin id of the receiver, "" = broadcast
    string topic = 3;        // message topic
    bytes payload = 4;       // plugin-defined payload
    uint64 correlationId = 5;
    bool isResponse = 6;
    int32 errorCode = 7;     // 0 = ok
    string errorMessage = 8;
}

message ConnectMessage {
    // Zero identifies legacy clients that predate transport session isolation.
    int64 sessionId = 1;
    // Client platform: "android" or "ios". Empty for clients that predate this field.
    string platform = 2;
    // Official field numbers 1-2 match upstream/master. Official may later
    // append fields in 3-999. Duplex-only fields start at 1000 so those
    // additions will not collide. This wire is not interoperable with
    // Duplex 2.1.2, which used fields 2/3 for capability flags; upgrade
    // the desktop and phone together.
    bool supportsDownlink = 1000;
    bool supportsPlaybackRouting = 1001;
}

message DownlinkRequestMessage {
    int64 sessionId = 1;
    int64 requestId = 2;
    bool enabled = 3;
    // 仅停止请求可携带，用于区分播放故障与用户主动关闭。
    string playbackError = 4;
}

message DownlinkStateMessage {
    int64 sessionId = 1;
    int64 requestId = 2;
    int64 streamId = 3;
    bool supported = 4;
    bool active = 5;
    string error = 6;
    int32 sampleRate = 7;
    int32 channelCount = 8;
    int32 audioFormat = 9;
    bool supportsPlaybackRouting = 10;
    string routeState = 11;
    string routeError = 12;
}

// Negotiated desktop-to-phone PCM16 LE: 48 kHz, stereo, 20 ms / 3840 bytes.
message DownlinkAudioMessage {
    int64 sessionId = 1;
    int64 streamId = 2;
    int64 sequenceNumber = 3;
    bytes pcm = 4;
}

message MuteMessage {
    optional bool isMuted = 1;
}

message PingMessage {
    int64 timestamp = 1;
}

message PongMessage {
    int64 timestamp = 1;
}

message AudioPacketMessageOrdered {
    int32 sequenceNumber = 1;
    AudioPacketMessage audioPacket = 2;
    int64 timestamp = 3;
    bytes fecBuffer = 4;
    int32 fecSequenceNumber = 5;
    int64 sessionId = 6;
    // Original byte length of each source packet in the FEC group. Empty for legacy senders.
    repeated uint32 fecPacketLengths = 7;
}

message AudioPacketMessage {
    bytes buffer = 1;
    int32 sampleRate = 2;
    int32 channelCount = 3;
    int32 audioFormat = 4;
    // Codec of the buffer: 0 = raw PCM (legacy default), 1 = Opus.
    // Opus payloads carry compressed audio; audioFormat still describes
    // the originating capture format for telemetry but is not used to decode.
    int32 codec = 5;
}

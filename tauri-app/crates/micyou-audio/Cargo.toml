[package]
name = "micyou-audio"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["dsp"]
dsp = ["dep:nnnoiseless", "dep:rustfft"]
noise-suppression = ["dsp", "dep:micyou-infer"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4.32"
cpal.workspace = true
rubato = "5.0.1"
ringbuf = "0.5.2"

# DSP dependencies (optional)
nnnoiseless = { version = "0.5.2", optional = true }
micyou-infer = { workspace = true, optional = true }
rustfft = { version = "6.4.1", optional = true }

[target.'cfg(windows)'.dependencies]
wasapi = "0.25"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization"] }
